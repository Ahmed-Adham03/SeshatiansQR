<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal contact page with phone, email, and LinkedIn details."
    />
    <title>Zyad | Contact</title>
    <style>
      :root {
        --green: #257246;
        --green-deep: #266f45;
        --green-dark: #123f29;
        --green-black: #0b281b;
        --white-warm: #f9faf4;
        --mist: #e7f0e8;
        --line: rgba(37, 114, 70, 0.18);
        --ink: #143223;
        --muted: #647a6c;
        --gold: #c8a968;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--white-warm);
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(160deg, rgba(249, 250, 244, 0) 0 38%, var(--white-warm) 38%),
          radial-gradient(circle at 18% 6%, rgba(200, 169, 104, 0.26), transparent 16rem),
          linear-gradient(145deg, var(--green-black), var(--green) 48%, var(--mist) 48%);
      }

      main {
        width: min(100%, 34rem);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr;
        padding: max(1.25rem, env(safe-area-inset-top)) clamp(1.15rem, 5vw, 2rem)
          max(1.4rem, env(safe-area-inset-bottom));
      }

      .hero {
        min-height: 46vh;
        display: grid;
        align-content: end;
        gap: clamp(1rem, 4vh, 1.65rem);
        padding-top: 1.5rem;
        color: var(--white-warm);
      }

      .photo-stage {
        width: min(62vw, 14rem);
        aspect-ratio: 1;
        position: relative;
        display: grid;
        place-items: center;
      }

      .photo-stage::before,
      .photo-stage::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
      }

      .photo-stage::before {
        inset: -0.95rem;
        border: 1px solid rgba(249, 250, 244, 0.42);
      }

      .photo-stage::after {
        inset: 0.65rem -1.1rem -1.1rem 0.65rem;
        border: 1px solid rgba(200, 169, 104, 0.58);
      }

      .photo {
        width: 100%;
        height: 100%;
        border-radius: 999px;
        border: 0.38rem solid rgba(249, 250, 244, 0.96);
        object-fit: cover;
        background:
          linear-gradient(135deg, rgba(37, 114, 70, 0.95), rgba(18, 63, 41, 0.96)),
          var(--green);
        box-shadow: 0 1.7rem 4rem rgba(9, 37, 23, 0.32);
      }

      .intro {
        display: grid;
        gap: 0.75rem;
      }

      .eyebrow {
        width: fit-content;
        margin: 0;
        padding-bottom: 0.32rem;
        border-bottom: 1px solid rgba(249, 250, 244, 0.52);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        color: var(--white-warm);
        font-size: clamp(3.1rem, 17vw, 5.8rem);
        line-height: 0.86;
        font-weight: 900;
        letter-spacing: 0;
        text-shadow: 0 0.18rem 1.25rem rgba(6, 29, 18, 0.42);
      }

      .role {
        max-width: 22rem;
        margin: 0;
        font-size: clamp(1rem, 4.5vw, 1.18rem);
        line-height: 1.55;
        color: rgba(249, 250, 244, 0.86);
      }

      .contact {
        display: grid;
        align-content: end;
        gap: clamp(1.15rem, 4vh, 1.6rem);
        padding-top: clamp(1.4rem, 5vh, 2.2rem);
      }

      .quick-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.7rem;
      }

      .action {
        min-height: 4.25rem;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--green-dark);
        background: rgba(255, 255, 255, 0.48);
        text-decoration: none;
        box-shadow: 0 1rem 2.2rem rgba(18, 63, 41, 0.08);
        transition:
          transform 180ms ease,
          color 180ms ease,
          border-color 180ms ease,
          background 180ms ease;
      }

      .action:hover {
        transform: translateY(-2px);
        color: var(--white-warm);
        border-color: rgba(37, 114, 70, 0.2);
        background: var(--green);
      }

      .action:focus-visible,
      .detail-link:focus-visible {
        outline: 3px solid rgba(37, 114, 70, 0.28);
        outline-offset: 4px;
      }

      .action svg {
        width: 1.65rem;
        height: 1.65rem;
      }

      .details {
        display: grid;
        border-top: 1px solid var(--line);
      }

      .detail-link {
        min-height: 4.65rem;
        display: grid;
        grid-template-columns: 2.85rem minmax(0, 1fr) 1.35rem;
        align-items: center;
        gap: 0.85rem;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        text-decoration: none;
      }

      .detail-icon {
        width: 2.85rem;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 999px;
        color: var(--white-warm);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0)),
          var(--green-deep);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      }

      .detail-icon svg {
        width: 1.34rem;
        height: 1.34rem;
      }

      .label {
        display: block;
        margin-bottom: 0.18rem;
        font-size: 0.74rem;
        font-weight: 850;
        color: var(--green-deep);
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .value {
        display: block;
        overflow-wrap: anywhere;
        font-size: clamp(1rem, 4.2vw, 1.14rem);
        font-weight: 760;
        line-height: 1.32;
      }

      .arrow {
        width: 1.2rem;
        height: 1.2rem;
        color: rgba(20, 50, 35, 0.42);
        transition:
          color 180ms ease,
          transform 180ms ease;
      }

      .detail-link:hover .arrow {
        color: var(--green);
        transform: translate(2px, -2px);
      }

      .note {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
        text-align: center;
      }

      svg {
        display: block;
      }

      @media (max-width: 370px) {
        main {
          padding-inline: 0.95rem;
        }

        .hero {
          min-height: 44vh;
        }

        .detail-link {
          grid-template-columns: 2.55rem minmax(0, 1fr) 1.1rem;
          gap: 0.72rem;
        }

        .detail-icon {
          width: 2.55rem;
        }
      }

      @media (min-width: 760px) {
        main {
          width: min(100%, 42rem);
        }

        .hero {
          min-height: 52vh;
        }

        .photo-stage {
          width: 15.5rem;
        }
      }
    </style>
  </head>
  <body>

            <span class="detail-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">

            <span>
              <span class="label">LinkedIn</span>

            <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">

        <p class="note">Scan, save, and connect anytime.</p>
      </section>
    </main>
  </body>
</html>
